data:
  # 原始数据存放目录（未处理）
  raw_dir: data/raw
  # 中间过程文件目录（可选，用于缓存）
  interim_dir: data/interim
  # 预处理后的标准化数据目录（如 JSONL / 划分好的 train/val/test）
  processed_dir: data/processed
  # 外部数据（第三方库、规则库等）目录
  external_dir: data/external

  # 期望的原始表格列名（可以根据自己的数据修改）
  columns:
    # 底物 SMILES 列名
    src: "src"
    # 产物 SMILES 列名
    tgt: "tgt"

  # toy 示例文件名（可自定义）
  # 原始数据文件，例如一个包含 src/tgt 的 CSV
  raw_file: "toy_pairs.csv"
  # 切分后的训练集文件名（位于 processed_dir）
  train_file: "train.csv"
  # 切分后的验证集文件名（位于 processed_dir）
  valid_file: "valid.csv"
  # 切分后的测试集文件名（位于 processed_dir）
  test_file: "test.csv"

split:
  # 验证集占总数据的比例
  valid_ratio: 0.1
  # 测试集占总数据的比例
  test_ratio: 0.1
  # 随机种子（控制切分可复现）
  seed: 42

