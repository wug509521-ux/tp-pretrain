# EAWAG_BBD 预训练配置

seed: 42  # 全局随机种子（Python/NumPy/PyTorch）

# 实验名称（将作为 runs/exp_name/ 子目录名）
exp_name: "eawag_pretrain"

data:
  config_path: configs/data_pretrain.yaml
  train_file: "data/processed/pretrain/split_scaffold/train.jsonl"
  valid_file: "data/processed/pretrain/split_scaffold/val.jsonl"
  max_src_length: 256
  max_tgt_length: 256
  batch_size: 8
  num_workers: 0
  use_reaction_text: false
  # batch 大小（单卡）
  batch_size: 8
  # DataLoader 的 worker 数量（Windows 上建议 0）
  num_workers: 0
  # 是否在输入中拼接 reaction 文本（当 metadata.raw_reaction 存在时）
  # 格式：[DOMAIN=xxx] [SOURCE=xxx] [REACTION_TEXT] xxx [SUBSTRATE] substrate_smiles
  use_reaction_text: false

model:
  # 模型配置文件路径
  config_path: configs/model.yaml

training:
  # 训练轮数（epoch）
  num_epochs: 10
  # AdamW 学习率
  learning_rate: 3e-4
  # 权重衰减系数
  weight_decay: 0.0
  # warmup 步数（线性 warmup）
  warmup_steps: 1000
  # 梯度累积步数（>1 时可视为增大有效 batch）
  gradient_accumulation_steps: 1
  # 是否开启混合精度训练（当前 Trainer 未启用，可作为预留）
  fp16: false
  # 每隔多少个 global step 打印一次日志
  log_steps: 100
  # 每隔多少个 global step 在验证集上评估（占位，当前 Trainer 未实现 eval）
  eval_steps: 500
  # 每隔多少个 global step 保存一次 checkpoint（占位）
  save_steps: 1000

