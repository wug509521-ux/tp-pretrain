seed: 42  # 全局随机种子（Python/NumPy/PyTorch）

# 实验名称（将作为 runs/exp_name/ 子目录名），可选；不填则使用时间戳
exp_name: "debug_run"

# 旧的 output_dir/logging_dir 字段不再直接使用，由 runs/exp_name 统一管理
# 保留仅为兼容性参考
output_dir: outputs/checkpoints  # 已由 runs/exp_name/checkpoints 取代
logging_dir: logs                # 已由 runs/exp_name/train.log 取代

data:
  # 数据配置文件路径（通常为 configs/data.yaml）
  config_path: configs/data.yaml

  # 训练集文件（JSONL / CSV，视数据管线而定）
  train_file: data/processed/train.jsonl
  # 验证集文件
  valid_file: data/processed/valid.jsonl

  # 编码端最大 token 长度（substrate）
  max_src_length: 256
  # 解码端最大 token 长度（product）
  max_tgt_length: 256

  # batch 大小（单卡）
  batch_size: 4
  # DataLoader 的 worker 数量（Windows 上建议 0）
  num_workers: 0
  # 是否在输入中拼接 reaction 文本（当 metadata.raw_reaction 存在时）
  # 格式：[DOMAIN=xxx] [SOURCE=xxx] [REACTION_TEXT] xxx [SUBSTRATE] substrate_smiles
  use_reaction_text: false

model:
  # 模型配置文件路径（通常为 configs/model.yaml）
  config_path: configs/model.yaml

training:
  # 训练轮数（epoch）
  num_epochs: 1
  # AdamW 学习率
  learning_rate: 5e-5
  # 权重衰减系数
  weight_decay: 0.0
  # warmup 步数（线性 warmup）
  warmup_steps: 0
  # 梯度累积步数（>1 时可视为增大有效 batch）
  gradient_accumulation_steps: 1
  # 是否开启混合精度训练（当前 Trainer 未启用，可作为预留）
  fp16: false
  # 每隔多少个 global step 打印一次日志
  log_steps: 10
  # 每隔多少个 global step 在验证集上评估（占位，当前 Trainer 未实现 eval）
  eval_steps: 50
  # 每隔多少个 global step 保存一次 checkpoint（占位）
  save_steps: 100

