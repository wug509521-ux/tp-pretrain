data:
  batch_size: 16
  max_src_length: 256
  max_tgt_length: 256
  num_workers: 4
  train_file: data/activated_sludge_pair622_552/train.jsonl
  use_reaction_text: true
  valid_file: data/activated_sludge_pair622_552/validation.jsonl
experiment_name: sludge_finetune_rt
model:
  model_name: t5-small
training:
  eval_steps: 200
  learning_rate: 5.0e-05
  log_every_n_steps: 20
  num_epochs: 15
  save_best: true
  save_last: true
  seed: 42
  weight_decay: 0.01
