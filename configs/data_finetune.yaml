# Sludge 微调数据集配置

# 原始数据文件路径（绝对路径）
raw_input: D:\yuce\yuxunlian\tp_pretrain_project\data\raw\Sludge_Reactions_with_reaction.csv

# 输入文件格式
input_format: csv

# 输出 JSONL 文件路径
output: data/processed/sludge_finetune.jsonl

# 列名映射
substrate_col: Substrates
product_col: Products
reaction_col: Reaction

# 数据集名称（用于自动识别和标记）
dataset_name: Sludge

# 数据切分配置
split:
  # 验证集占总数据的比例
  valid_ratio: 0.1
  # 测试集占总数据的比例
  test_ratio: 0.1
  # 随机种子（控制切分可复现）
  seed: 42
  # 切分模式：random 或 scaffold
  split_mode: scaffold

