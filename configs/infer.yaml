data:
  # 数据配置文件路径（通常为 configs/data.yaml）
  config_path: configs/data.yaml

  # 预测输入文件（通常为 JSONL，格式为 TPReactionRecord）
  input_file: data/processed/test.jsonl
  # 预测输出结果（JSONL）
  output_file: outputs/predictions.jsonl

  # 编码端最大 token 长度（substrate）
  max_src_length: 256
  # 解码端最大 token 长度（product）
  max_tgt_length: 256

  # 推理 batch 大小
  batch_size: 4

model:
  # 模型配置文件路径（通常为 configs/model.yaml）
  config_path: configs/model.yaml
  # 加载 checkpoint 的目录（传给 from_pretrained）
  checkpoint_path: outputs/checkpoints/latest

inference:
  # beam search 的 beam 数
  num_beams: 10
  # 每个样本返回的候选数量（top-k）
  num_return_sequences: 10
  # 生成时最大新 token 数
  max_new_tokens: 256
  # 是否使用采样（目前未在 baseline 中使用，预留）
  do_sample: false

evaluation:
  # 预测结果文件路径（通常与 data.output_file 相同或其拷贝）
  predictions_file: outputs/predictions.jsonl
  # 评估输出目录（metrics.json, summary.csv）
  output_dir: outputs/eval

