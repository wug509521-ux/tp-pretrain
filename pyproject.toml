[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tp-pretrain-reproducibility"
version = "2026.10.13"
description = "Reproducible TP prediction models and evaluation workflows"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate>=0.30.0",
  "datasets>=2.18.0",
  "joblib>=1.3.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0.0",
  "rdkit>=2023.9.1",
  "regex>=2023.0.0",
  "rich>=13.0.0",
  "scikit-learn>=1.3.0",
  "sentencepiece>=0.2.0",
  "torch>=2.5.1",
  "tqdm>=4.66.0",
  "transformers>=4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
